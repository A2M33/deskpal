<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>deskpal banner</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="oled.css">
<link rel="stylesheet" href="banner.css">
<script src="trace.js"></script>
</head>
<body>
<main class="sheet">
  <section class="intro">
    <img class="icon" src="icon.png" alt="">
    <h1>deskpal</h1>
    <p class="sub">An ESP32 desk display: the time, the weather, your room and your GitHub grid.</p>
    <p class="meta"><span class="pad" data-state="live"></span>C++ · ESP32 · runs in Wokwi</p>
  </section>

  <div class="module">
    <span class="hole" style="left:16px;top:16px"></span><span class="hole" style="right:16px;top:16px"></span>
    <span class="hole" style="left:16px;bottom:16px"></span><span class="hole" style="right:16px;bottom:16px"></span>
    <div class="pins"><span>GND</span><span>VCC</span><span class="lit" id="scl">SCL</span><span class="lit" id="sda">SDA</span></div>
    <figure class="bezel" style="margin:0">
      <div class="glass"><img src="../../docs/screen-clock.png" alt=""></div>
    </figure>
  </div>

  <p class="callout lit" style="left:1010px;top:52px;width:200px"><b>I2C to the ESP32</b><span id="l-scl">SCL to GPIO 22</span><br><span id="l-sda">SDA to GPIO 21</span></p>
  <p class="callout" style="left:600px;top:576px;width:420px"><b style="display:inline">SSD1306, 128×64.</b> Four screens, eight seconds each.</p>
</main>
<script>
  // from just left of each label line to the pin hole (the ::before ring sits 7px below the span top)
  const pin = id => { const r = document.getElementById(id).getBoundingClientRect(); return [r.left + r.width / 2, r.top + 7]; };
  const lab = id => { const r = document.getElementById(id).getBoundingClientRect(); return [r.left - 12, r.top + r.height / 2]; };
  traces([
    [lab("l-scl"), pin("scl"), { lit: true, tail: 24, r: 0 }],
    [lab("l-sda"), pin("sda"), { lit: true, tail: 12, r: 0 }],
  ]);
</script>
</body>
</html>
